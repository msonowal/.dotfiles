"$schema" = "https://starship.rs/config-schema.json"

format = """
$directory\
$git_branch\
$git_status\
$php\
$nodejs\
$bun\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 5
truncate_to_repo = true
style = "bold cyan"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"

[php]
format = "[$symbol($version)]($style) "
symbol = " "
detect_files = ["composer.json", ".php-version", "artisan"]
style = "bold 147"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = " "
style = "bold green"

[bun]
format = "[$symbol($version)]($style) "
symbol = " "
style = "bold yellow"

[docker_context]
format = "[$symbol$context]($style) "
symbol = " "
style = "bold blue"

[cmd_duration]
min_time = 3_000
format = "[$duration]($style) "
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Disabled modules (keep prompt fast)
[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[kubernetes]
disabled = true

[python]
disabled = true

[ruby]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[swift]
disabled = true
